name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  CONTAINER_NAME: tetris
  APP_PORT: "9090"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if [ -z "${{ secrets.GHCR_PAT }}" ]; then
              echo "Missing GHCR_PAT secret (needs read:packages)"
              exit 1
            fi

            docker login ghcr.io -u "${{ secrets.GHCR_USER || github.actor }}" -p "${{ secrets.GHCR_PAT }}"
            docker pull "${{ env.IMAGE }}"
            docker stop "${{ env.CONTAINER_NAME }}" || true
            docker rm "${{ env.CONTAINER_NAME }}" || true
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p "${{ env.APP_PORT }}:${{ env.APP_PORT }}" \
              "${{ env.IMAGE }}"
